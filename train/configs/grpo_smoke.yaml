# Shared feasibility GRPO schedule (tiny smoke, not the G-ablation study).
env: target_expr
split_path: data/splits/target_expr_train.jsonl
max_steps: 15
per_device_train_batch_size: 4
gradient_accumulation_steps: 1
num_generations: 4
max_prompt_length: 512
max_completion_length: 128
learning_rate: 2.0e-5
logging_steps: 1
bf16: true
seed: 566
beta: 0.04
temperature: 1.0
report_to: []
use_vllm: false
